<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      body { margin: 0; width: 300px; font: 14px/1.45 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #161a26; background: #fff; }
      main { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
      h1 { font-size: 15px; margin: 0; }
      p { margin: 0; color: #667085; }
      .ready { color: #12a150; font-weight: 600; }
      .seg { display: flex; padding: 3px; background: #f1f3f9; border-radius: 10px; gap: 3px; }
      .seg button { flex: 1; background: transparent; color: #667085; padding: 7px; border-radius: 8px; }
      .seg button:hover { background: #e6e9f2; }
      .seg button[aria-checked='true'] { background: #fff; color: #161a26; box-shadow: 0 1px 2px rgba(16,24,40,.12); }
      button { font: inherit; font-weight: 600; padding: 10px 14px; border-radius: 10px; border: 0; background: #3355e0; color: #fff; cursor: pointer; }
      button:hover { background: #2744c4; }
      button.secondary { background: #fff; color: #161a26; border: 1px solid #cfd4e2; }
      button.secondary:hover { background: #f1f3f9; }
      button[disabled] { opacity: .45; cursor: default; }
      a { color: #3355e0; font-size: 13px; text-decoration: none; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>German Learner</h1>
      <p id="hint">Open a YouTube video, then click here.</p>
      <div class="seg" role="radiogroup" aria-label="AI chat" id="provider">
        <button role="radio" data-provider="chatgpt" aria-checked="false">ChatGPT</button>
        <button role="radio" data-provider="claude" aria-checked="false">Claude</button>
      </div>
      <button id="open" hidden>Open in app</button>
      <button id="go" disabled>Create subtitles for this video</button>
      <button id="lesson" class="secondary" disabled title="A word lesson written by the AI from this video's transcript">Create a lesson from this video</button>
      <a id="settings">Settings</a>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
